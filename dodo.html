<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ذكرياتي 📸</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <!-- ✅ الهيدر -->
  <header class="app-header text-center p-3 shadow-sm">
    <h4>📔 ذكرياتي</h4>
    <p class="small text-light">لحظات بترتيب زمني</p>
  </header>

  <!-- ✅ Timeline -->
  <main class="container mt-3 mb-5">
    <div class="timeline">

      <div class="timeline-item mb-4">
        <h6>🏖️ صيف 2025</h6>
        <div class="image-stack">
          <img src="https://placehold.co/200x150/FFD700/000?text=رحلة+1" class="stacked-img img-1">
          <img src="https://placehold.co/200x150/FFA07A/000?text=رحلة+2" class="stacked-img img-2">
          <img src="https://placehold.co/200x150/FF6347/000?text=رحلة+3" class="stacked-img img-3">
        </div>
      </div>

      <div class="timeline-item mb-4">
        <h6>🎂 عيد ميلاد 2024</h6>
        <div class="image-stack">
          <img src="https://placehold.co/200x150/87CEFA/000?text=عيد+1" class="stacked-img img-1">
          <img src="https://placehold.co/200x150/4682B4/000?text=عيد+2" class="stacked-img img-2">
          <img src="https://placehold.co/200x150/6495ED/000?text=عيد+3" class="stacked-img img-3">
        </div>
      </div>

    </div>
  </main>

  <!-- ✅ Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="#"><i class="fas fa-home"></i><span>الرئيسية</span></a>
    <a href="#"><i class="fas fa-images"></i><span>الألبومات</span></a>
    <a href="#"><i class="fas fa-user"></i><span>الملف</span></a>
  </nav>

  <!-- ✅ Modal -->
  <div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <span class="btn-close m-2" data-bs-dismiss="modal"></span>
        <img id="modalImage" class="w-100 rounded">
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
